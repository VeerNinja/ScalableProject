name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      

    steps:
    # 1️⃣ Checkout the repo
    - name: Checkout code
      uses: actions/checkout@v3

    # 2️⃣ Set up JDK for Maven
    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: 17

    # 3️⃣ Build Order Service with Maven
    - name: Build Order Service
      run: mvn -B -f order-service/pom.xml clean package

    # 4️⃣ Build User Service with Maven
    - name: Build User Service
      run: mvn -B -f user-service/pom.xml clean package

    # 5️⃣ Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 6️⃣ Build and push Docker image: Order Service
    - name: Build & push Order Service image
      run: |
        docker build -t $DOCKER_USERNAME/order-service:latest ./order-service
        docker push $DOCKER_USERNAME/order-service:latest

    # 7️⃣ Build and push Docker image: User Service
    - name: Build & push User Service image
      run: |
        docker build -t $DOCKER_USERNAME/user-service:latest ./user-service
        docker push $DOCKER_USERNAME/user-service:latest

    # 8️⃣ Set up kubectl
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: '1.27.3'

    # 9️⃣ Configure kubeconfig
    - name: Configure kubeconfig
      run: |
        echo "$KUBECONFIG_CONTENT" > $HOME/.kube/config

    # 🔟 Deploy to Kubernetes
    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/order-deployment.yaml
        kubectl apply -f k8s/user-deployment.yaml
        kubectl apply -f k8s/order-service.yaml
        kubectl apply -f k8s/user-service.yaml

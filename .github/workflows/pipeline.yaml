name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Order Service
      working-directory: ./order-service
      run: mvn clean package

    - name: Build User Service
      working-directory: ./user-service
      run: mvn clean package


    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Images
      run: |
        docker build -t 2024mt03108/order-service:latest ./order-service
        docker push 2024mt03108/order-service:latest
        docker build -t 2024mt03108/user-service:latest ./user-service
        docker push 2024mt03108/user-service:latest

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: '1.27.3'

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/order-deployment.yaml
        kubectl apply -f k8s/user-deployment.yaml

{{- if .Values.httpRoute.enabled }}
apiVersion: networking.x-k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "scalableproject.fullname" . }}-httproute
  labels:
    {{- include "scalableproject.labels" . | nindent 4 }}
spec:
  {{- range .Values.httpRoute.services }}
  hostnames:
    - {{ .host | quote }}
  rules:
    - matches:
        - path:
            type: Prefix
            value: {{ .path }}
      forwardTo:
        - serviceName: {{ include "scalableproject.fullname" $ }}-{{ .name }}
          port: {{ .port }}
  {{- end }}
{{- end }}
